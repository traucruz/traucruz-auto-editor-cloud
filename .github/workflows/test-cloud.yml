
name: Testar computador na nuvem

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verificar ferramentas
        run: |
          python --version
          ffmpeg -version
